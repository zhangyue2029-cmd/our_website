<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div id="app"><main id="main-content" class="boot-state"><p>去向 · 职业导航</p><h1>正在准备你的探索空间…</h1></main></div>
  <noscript><p class="boot-state">请启用浏览器的 JavaScript 后刷新页面。</p></noscript>
  <script>
    const root = document.getElementById("app");
    if (location.protocol === "file:") {
      root.innerHTML = '<main id="main-content" class="boot-state"><p>去向 · 职业导航</p><h1>还差一步，就可以出发。</h1><p>请双击项目中的「启动预览.cmd」，或在项目目录的终端运行：</p><pre>node _server.cjs</pre><p>保持终端运行，然后打开下方地址。</p><a class="btn btn-primary" href="http://127.0.0.1:8124/">打开职业探索空间 →</a></main>';
    } else {
      import("./src/main.js").catch(error => {
        console.error("应用模块加载失败", error);
        root.innerHTML = '<main id="main-content" class="boot-state" role="alert"><h1>页面暂时没有加载成功</h1><p>请刷新重试，并检查项目中的 src 文件夹是否完整。</p><button class="btn btn-primary" onclick="location.reload()">重新加载</button></main>';
      });
    }
  </script>
